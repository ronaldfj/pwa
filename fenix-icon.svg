<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E2A44" />
      <stop offset="60%" stop-color="#0F1626" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>

    <!-- Center Glow -->
    <radialGradient id="sunGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#E65100" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F1626" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Fire Gradient 1 (Main Body & Primary Wings) -->
    <linearGradient id="goldFire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D84315" />
      <stop offset="35%" stop-color="#F57C00" />
      <stop offset="70%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#FFF176" />
    </linearGradient>

    <!-- Wing Left Gradient -->
    <linearGradient id="wingLeft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#BF360C" />
      <stop offset="40%" stop-color="#E65100" />
      <stop offset="80%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFF59D" />
    </linearGradient>

    <!-- Wing Right Gradient -->
    <linearGradient id="wingRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF360C" />
      <stop offset="40%" stop-color="#E65100" />
      <stop offset="80%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFF59D" />
    </linearGradient>

    <!-- Tail Flame Gradient -->
    <linearGradient id="tailGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#F4511E" />
      <stop offset="100%" stop-color="#AD1457" />
    </linearGradient>

    <!-- Subtle Blue Spark / Eye Gradient -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF" />
      <stop offset="100%" stop-color="#0091EA" />
    </linearGradient>

    <!-- Wing feather highlights -->
    <linearGradient id="featherLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FFEE58" />
    </linearGradient>

    <!-- Drop Shadow Filter for Phoenix -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#FF6D00" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base (Rounded Rect for iOS icon presentation) -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind Phoenix -->
  <circle cx="256" cy="245" r="190" fill="url(#sunGlow)" />

  <!-- Outer Ring Accent for Premium Finish -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldFire)" stroke-width="1.5" opacity="0.15" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldFire)" stroke-width="1" opacity="0.08" stroke-dasharray="8 6" />

  <!-- THE PHOENIX (RISING FLIGHT EMBLEM) -->
  <g filter="url(#shadow)">
    
    <!-- TAIL FLAMES (Elegant flowing ribbons) -->
    <!-- Center Tail -->
    <path d="M 256 320 Q 256 390 240 440 Q 256 420 260 375 Q 268 430 256 460 Q 272 410 266 350 Z" 
          fill="url(#tailGrad)" opacity="0.95" />
    
    <!-- Left Tail Ribbon -->
    <path d="M 246 330 Q 220 380 180 435 Q 210 400 230 365 Q 200 420 160 455 Q 205 410 238 355 Z" 
          fill="url(#tailGrad)" opacity="0.85" />
    
    <!-- Right Tail Ribbon -->
    <path d="M 266 330 Q 292 380 332 435 Q 302 400 282 365 Q 312 420 352 455 Q 307 410 274 355 Z" 
          fill="url(#tailGrad)" opacity="0.85" />

    <!-- LEFT WING - Lower Layer (Deep Amber/Crimson) -->
    <path d="M 245 285 Q 160 275 85 210 Q 135 240 185 260 Q 115 215 65 155 Q 120 195 185 230 Q 140 165 95 105 Q 160 160 220 215 Z" 
          fill="url(#wingLeft)" opacity="0.75" />

    <!-- RIGHT WING - Lower Layer (Deep Amber/Crimson) -->
    <path d="M 267 285 Q 352 275 427 210 Q 377 240 327 260 Q 397 215 447 155 Q 392 195 327 230 Q 372 165 417 105 Q 352 160 292 215 Z" 
          fill="url(#wingRight)" opacity="0.75" />

    <!-- LEFT WING - Upper Main Layer (Brilliant Golden Feathers) -->
    <!-- Primary Feather 1 (Topmost Soaring Blade) -->
    <path d="M 235 230 Q 180 160 110 70 Q 165 115 215 175 Q 185 110 135 48 Q 200 100 240 165 Z" 
          fill="url(#wingLeft)" />

    <!-- Primary Feather 2 -->
    <path d="M 230 250 Q 160 200 80 115 Q 140 165 200 210 Z" 
          fill="url(#featherLight)" />

    <!-- Primary Feather 3 -->
    <path d="M 235 270 Q 155 245 85 190 Q 150 225 215 245 Z" 
          fill="url(#wingLeft)" />

    <!-- Primary Feather 4 (Bottom curve) -->
    <path d="M 240 288 Q 175 280 120 245 Q 175 270 230 275 Z" 
          fill="url(#featherLight)" opacity="0.9" />

    <!-- RIGHT WING - Upper Main Layer (Brilliant Golden Feathers) -->
    <!-- Primary Feather 1 (Topmost Soaring Blade) -->
    <path d="M 277 230 Q 332 160 402 70 Q 347 115 297 175 Q 327 110 377 48 Q 312 100 272 165 Z" 
          fill="url(#wingRight)" />

    <!-- Primary Feather 2 -->
    <path d="M 282 250 Q 352 200 432 115 Q 372 165 312 210 Z" 
          fill="url(#featherLight)" />

    <!-- Primary Feather 3 -->
    <path d="M 277 270 Q 357 245 427 190 Q 362 225 297 245 Z" 
          fill="url(#wingRight)" />

    <!-- Primary Feather 4 (Bottom curve) -->
    <path d="M 272 288 Q 337 280 392 245 Q 337 270 282 275 Z" 
          fill="url(#featherLight)" opacity="0.9" />

    <!-- PHOENIX BODY (Sleek aerodynamic heart and chest) -->
    <!-- Torso Flame Silhouette -->
    <path d="M 256 165 Q 275 200 280 260 Q 282 305 256 340 Q 230 305 232 260 Q 237 200 256 165 Z" 
          fill="url(#goldFire)" />

    <!-- Inner Core Flame (Radiant White-Yellow Core) -->
    <path d="M 256 195 Q 267 225 268 265 Q 268 295 256 318 Q 244 295 244 265 Q 245 225 256 195 Z" 
          fill="#FFF9C4" opacity="0.9" />

    <!-- PHOENIX HEAD & CREST -->
    <!-- Head and Beak facing skyward with elegance -->
    <path d="M 256 165 Q 256 130 258 118 Q 262 108 274 102 Q 265 116 261 132 Q 262 150 256 165 Z" 
          fill="#FFF9C4" />
    
    <!-- Left Beak / Profile Edge -->
    <path d="M 256 165 Q 253 140 250 126 Q 244 142 250 156 Z" 
          fill="#FFA000" />

    <!-- Rising Crest Plumes (Crown of fire) -->
    <path d="M 256 126 Q 252 80 236 50 Q 254 75 256 112 Z" 
          fill="url(#featherLight)" />
    <path d="M 258 122 Q 268 75 286 42 Q 272 75 260 110 Z" 
          fill="#FFF59D" />
    <path d="M 257 110 Q 260 55 256 32 Q 264 60 259 95 Z" 
          fill="#FFFFFF" />

    <!-- Heart Emblem Accent (Core of Sustainable Energy) -->
    <circle cx="256" cy="248" r="4.5" fill="url(#cyanSpark)" />
  </g>
</svg>

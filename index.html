<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fénix</title>
<meta name="theme-color" content="#1F66C1">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./fenix-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F2ED; --card:#FFFFFF; --card2:#F6F5F1; --line:#E7E4DD;
    --text:#17181A; --muted:#8B8A86;
    --blue:#1F66C1; --bluebg:#E4EEF9; --calm:#1D9E75; --calmbg:#E2F2EB;
    --warn:#C97D0B; --warnbg:#FAE7C6; --risk:#D64545; --riskbg:#F9E2E2;
    --recov:#BFD8F2; --star:#E8940F;
    --heat-empty:#ECEAE4; --heat-partial:#D9D7D0; --heat-bad:#EFC5C5;
    --cb-border:#C9C7C1; --shadow:rgba(20,20,20,.03);
    --r:14px;
  }
  html[data-theme="dark"]{
    --bg:#10141D; --card:#1A2030; --card2:#232B3F; --line:#2E3750;
    --text:#EDEAE2; --muted:#8B93A7;
    --blue:#5B9BE6; --bluebg:#1E3A5F; --calm:#6FB5A0; --calmbg:#1E3B32;
    --warn:#E5B454; --warnbg:#453718; --risk:#E07A70; --riskbg:#472424;
    --recov:#3A5578; --star:#E5B454;
    --heat-empty:#242C3E; --heat-partial:#4A5670; --heat-bad:#6B3A3A;
    --cb-border:#5A6478; --shadow:rgba(0,0,0,.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--bg);}
  body{font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; justify-content:center;}
  .app{width:100%; max-width:430px; padding:20px 14px 92px;}
  h1{font-weight:700; font-size:22px; letter-spacing:-.01em;}
  .sub{color:var(--muted); font-size:13px; margin-top:3px; line-height:1.5;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:12px;
    box-shadow:0 1px 2px var(--shadow);}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:12px; font-size:15px; color:var(--text);}
  button:focus-visible{outline:2px solid var(--blue); outline-offset:2px;}
  .btn{display:block; width:100%; padding:14px; margin-top:10px; background:var(--card);
    border:1px solid var(--line); text-align:left; transition:border-color .15s;}
  .btn:hover{border-color:var(--blue);}
  .btn.primary{background:var(--blue); color:#fff; font-weight:600; text-align:center; border:none;}
  .btn.ghost{background:none; border:none; color:var(--muted); font-size:13px; text-align:center; padding:9px;}
  .q{font-size:18px; font-weight:700; line-height:1.3; letter-spacing:-.01em;}
  .voice{font-size:18px; line-height:1.55; text-align:center; padding:18px 8px; font-weight:500; font-style:italic;}
  .anchors{font-size:11.5px; color:var(--muted); line-height:1.6; margin-top:12px;}
  .scale{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px;}
  .scale button{padding:13px 0; background:var(--card2); border:1px solid var(--line); font-variant-numeric:tabular-nums; transition:all .15s;}
  .scale button:hover{border-color:var(--blue);}
  .scale button.picked{background:var(--bluebg); border-color:var(--blue); color:var(--blue); font-weight:700; transform:scale(1.06);}
  .back{background:none; color:var(--muted); font-size:13px; padding:0; margin-bottom:14px; border-radius:0;}
  input[type=text], input[type=password], input[type=email], select{width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-family:inherit; font-size:14px; margin-top:6px;}
  label{font-size:12px; color:var(--muted);}
  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:12px 8px; text-align:center;
    box-shadow:0 1px 2px var(--shadow);}
  .kval{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums;}
  .klab{font-size:10.5px; color:var(--muted); margin-top:2px;}
  .heat{display:grid; grid-template-columns:repeat(14,1fr); gap:4px; margin:10px 0 8px;}
  .heat div{aspect-ratio:1; border-radius:3px;}
  .legend{display:flex; gap:11px; font-size:10.5px; color:var(--muted); flex-wrap:wrap;}
  .legend span i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:-1px;}
  .secthead{font-size:11px; letter-spacing:.06em; color:var(--muted); text-transform:uppercase; margin-bottom:8px; font-weight:600;}
  .gov2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .gcell{text-align:center;}
  .gval{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums;}
  .glab{font-size:11.5px; color:var(--muted);}
  .govmsg{border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.55; width:100%; text-align:left;}
  .act{display:flex; align-items:center; gap:11px; padding:13px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; margin-top:9px; width:100%; text-align:left;}
  .act .cb{width:22px; height:22px; border-radius:7px; border:2px solid var(--cb-border); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;}
  .act.on .cb{background:var(--calm); border-color:var(--calm);}
  .act.on{border-color:var(--calm);}
  .aname{font-size:14px; line-height:1.4;}
  .atag{margin-left:auto; font-size:10px; padding:3px 8px; border-radius:99px; flex-shrink:0; font-weight:600;}
  .star{background:none; font-size:19px; padding:0 2px; flex-shrink:0; filter:grayscale(1) opacity(.4);}
  .star.on{filter:none;}
  .msgbox{background:var(--card2); border-radius:10px; padding:12px; font-size:13px; line-height:1.6; margin-top:10px; white-space:pre-wrap;}
  .chip{font-size:11px; padding:3px 10px; border-radius:99px; font-weight:600;}
  .row{display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:10px;
    box-shadow:0 1px 2px var(--shadow);}
  .toast{position:fixed; bottom:86px; left:50%; transform:translateX(-50%); background:var(--text);
    color:#fff; padding:10px 18px; border-radius:99px; font-size:13px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:60;}
  .toast.show{opacity:1;}
  .arcwrap{width:100%; max-width:112px; margin:0 auto;}
  .nav{position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; justify-content:center; z-index:40;}
  .navin{width:100%; max-width:430px; display:grid; grid-template-columns:1fr 1fr 1fr;}
  .nav button{background:none; border-radius:0; padding:10px 0 12px; text-align:center; color:var(--muted); font-size:11px;}
  .nav button.on{color:var(--blue); font-weight:600;}
  .nav .ic{font-size:19px; display:block; margin-bottom:2px;}
  .fab{position:fixed; bottom:78px; right:calc(50% - 215px + 14px); background:var(--card);
    border:1.5px solid var(--blue); color:var(--blue); padding:10px 15px; border-radius:99px;
    font-size:13px; font-weight:600; box-shadow:0 3px 12px rgba(20,20,20,.12); z-index:50;}
  @media (max-width:470px){ .fab{right:14px;} }
  .overlay{position:fixed; inset:0; background:rgba(23,24,26,.55); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:55;}
  .ovcard{background:var(--card); border-radius:18px; padding:22px 18px; max-width:400px; width:100%;
    box-shadow:0 10px 40px rgba(20,20,20,.25);}
  .timer{font-size:42px; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; padding:14px 0 4px;}
  .bar{height:4px; background:var(--line); border-radius:2px; overflow:hidden;}
  .bar div{height:100%; background:var(--blue); transition:width 1s linear;}

  /* Ritual step progress */
  .rsteps{display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:18px;}
  .rstep{width:28px; height:28px; border-radius:50%; font-size:12px; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    background:var(--card2); border:2px solid var(--line); color:var(--muted); transition:all .2s;}
  .rstep.active{border-color:var(--blue); color:var(--blue); background:var(--bluebg);}
  .rstep.done{border-color:var(--calm); color:#fff; background:var(--calm);}
  .rline{width:24px; height:2px; background:var(--line);}
  .rline.done{background:var(--calm);}

  /* Selector de días de una acción */
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:6px;}
  .days button{padding:9px 0; background:var(--card2); border:1px solid var(--line); font-size:13px;}
  .days button.on{background:var(--bluebg); border-color:var(--blue); color:var(--blue); font-weight:600;}
  .edit{background:none; color:var(--muted); font-size:15px; padding:0 3px; flex-shrink:0;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div class="app" id="app"><div class="card">Cargando…</div></div>
<button class="fab" id="fab" style="display:none;">⇄ Sustituir</button>
<nav class="nav" id="nav" style="display:none;"><div class="navin">
  <button id="nv-hoy"><span class="ic">☀️</span>Hoy</button>
  <button id="nv-aj"><span class="ic">⚙️</span>Ajustes</button>
  <button id="nv-so"><span class="ic">🚪</span>Salir</button>
</div></nav>
<div class="toast" id="toast"></div>

<script type="module">
import {
  watchAuth, processRedirectResult, signUpWithEmail, signInWithEmailPass, resetPassword,
  signInWithGoogle, signOutUser, cloud, maybeMigrateFromLocalStorage
} from './firebase-init.js';

/* ===== ÁREAS (Sistema MP3) ===== */
const AREAS = {
  espiritual:{nom:'Espiritual',color:'#7C5FB0'}, familiar:{nom:'Familiar',color:'#C25B8A'},
  fisica:{nom:'Física',color:'#1D9E75'}, financiera:{nom:'Financiera',color:'#C97D0B'},
  profesional:{nom:'Profesional',color:'#1F66C1'}, personal:{nom:'Personal',color:'#C2542B'}
};
const SUGERIDAS = [
  {name:'Leer y meditar un versículo',area:'espiritual',goal:'Dedicar tiempo a buscar la voluntad de Dios'},
  {name:'Jugar 30 min con los niños',area:'familiar',goal:null},
  {name:'Caminata de 30 minutos',area:'fisica',goal:'Ponerme en forma'},
  {name:'Leer 20 min (meta: 6 libros/año)',area:'personal',goal:'Leer 6 libros al año'},
  {name:'Practicar inglés 15 min',area:'profesional',goal:'Mejorar mi inglés para plazas internacionales'},
  {name:'Avanzar el negocio en línea',area:'financiera',goal:'Emprender un negocio que genere Q10,000 mensuales'}
];
const METAS_SEMILLA = [
  {name:'Emprender un negocio que genere Q10,000 mensuales', area:'financiera', why:'Generar ingresos aparte del sueldo y ganar libertad', hor:10},
  {name:'Mejorar mi inglés para plazas internacionales', area:'profesional', why:'Abrir puertas a oportunidades internacionales', hor:2},
  {name:'Ponerme en forma', area:'fisica', why:'Mejorar mi estado físico y reducir el estrés', hor:1},
  {name:'Leer 6 libros al año', area:'personal', why:'Crecimiento personal, vocabulario y cultura', hor:1},
  {name:'Dedicar tiempo a buscar la voluntad de Dios', area:'espiritual', why:'Escucharlo y servirle', hor:1},
  {name:'Estar doblemente enamorados con mi esposa', area:'familiar', why:'Mejorar mi relación de pareja', hor:1},
  {name:'Sacar un MBA en el INCAE', area:'profesional', why:'Mejorar mi liderazgo para mi objetivo de vida', hor:5},
  {name:'Comprar la casa de Vientos del Valle', area:'financiera', why:'', hor:10},
  {name:'Pasar más tiempo con mi mamá', area:'familiar', why:'', hor:1},
  {name:'Paseo mensual con toda la familia', area:'familiar', why:'Mantener a la familia unida y relajada', hor:1}
];
const HOR_MAX = 10; // las metas van de 1 a 10 años
const HOR_OPCIONES = Array.from({length:HOR_MAX},(_,i)=>i+1);
const HORIZONTES = [
  {max:1, id:'h1', nom:'Este año', sub:'Se trabajan ahora: de aquí sale tu meta principal ⭐'},
  {max:3, id:'h3', nom:'2–3 años', sub:'En preparación: aún no piden tu día a día'},
  {max:5, id:'h5', nom:'4–5 años', sub:'Mediano plazo'},
  {max:10, id:'h10', nom:'6–10 años · Visión', sub:'Tu dirección de vida: se visitan, no se cargan'}
];
function horBucket(h){ for(const b of HORIZONTES){ if((h||1)<=b.max) return b; } return HORIZONTES[3]; }
const AFIRM_BASE = [
  'Me quiero a mí mismo.',
  'Soy responsable.',
  'Tengo el control absoluto de mi mente y de mi vida.',
  '¡Puedo hacerlo!',
  'Me gusta mi trabajo y me gusta lo que hago.',
  'Algo maravilloso me va a ocurrir hoy.',
  'Sé que voy a tener éxito.',
  'Me siento saludable, me siento feliz, me siento estupendamente.',
  'Soy un imán para el dinero y las oportunidades.',
  'Perdono a todo el mundo por todo lo que me han hecho.',
  'Me gustan las personas y a las personas les gusto yo.'
];
const REFLEX = [
  { t:'Perdón', p:'¿Hay alguien —incluyéndote— a quien necesitas perdonar esta semana? Perdonar no es para el otro: es para liberar tu propia mente.' },
  { t:'Relaciones', p:'El 85% de la felicidad viene de tus relaciones. ¿A quién de tu familia le diste esta semana atención de calidad, sin juicio?' },
  { t:'Tiempo (80/20)', p:'¿Tus rocas principales de esta semana fueron de verdad el 20% que produce el 80%? ¿O elegiste lo urgente sobre lo importante?' },
  { t:'Miedo', p:'¿Qué evitaste esta semana por miedo al fracaso o al rechazo? Recuerda: tu lista de logros es evidencia contra ese miedo.' },
  { t:'Amor', p:'El amor se multiplica al darlo. ¿Dónde diste amor desinteresado esta semana? ¿Dónde pudiste y no lo hiciste?' },
  { t:'Dieta mental', p:'¿Qué alimentó tu mente esta semana: lo que entró antes de dormir y al despertar te construyó o te drenó?' }
];

/* ===== ESTADO ===== */
let state = { theme:'light', actions:[], logs:{}, affirmations:AFIRM_BASE.slice(), logros:[], goals:null, subs:{} };
let currentUser = null;
let pendingAuthError = null;
let pendingDataError = null;
let view = { name:'login' };
let timerId = null;
const TABS = { hoy:'hoy', ajustes:'ajustes' };
function tabOf(name){
  if(['hoy','am','pm','review'].includes(name)) return 'hoy';
  return 'ajustes';
}
function goalById(id){ return (state.goals||[]).find(g=>g.id===id)||null; }
function goalByName(n){ return (state.goals||[]).find(g=>g.name===n)||null; }

function todayStr(d){ const x=d||new Date();
  return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function addDays(s,n){ const p=s.split('-').map(Number); return todayStr(new Date(p[0],p[1]-1,p[2]+n)); }
function applyTheme(){ document.documentElement.dataset.theme = state.theme==='dark' ? 'dark' : 'light'; }
const MESES_CORTOS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fmtDateShort(s){ const p=s.split('-').map(Number); return p[2]+' '+MESES_CORTOS[p[1]-1]+' '+p[0]; }
function monthsSince(s){ const p=s.split('-').map(Number), now=new Date();
  let m=(now.getFullYear()-p[0])*12+(now.getMonth()-(p[1]-1));
  if(now.getDate()<p[2]) m--;
  return Math.max(0,m); }
function elapsedTxt(s){ const m=monthsSince(s);
  if(m<1) return 'esta semana';
  if(m<12) return 'hace '+m+' '+(m===1?'mes':'meses');
  const y=Math.floor(m/12), r=m%12;
  return 'hace '+y+(y===1?' año':' años')+(r?' '+r+'m':''); }
async function load(){
  await maybeMigrateFromLocalStorage(currentUser.uid);
  await cloud.attach(currentUser.uid, onRemoteChange);
  // Cuenta recién creada: sin perfil en Firestore y sin datos migrados desde
  // localStorage. Se decide ANTES del merge de abajo (que puede volver
  // state.goals truthy) para llevarla a la bienvenida en vez de a Hoy.
  const isNewAccount = !cloud.profile;
  state = Object.assign(state, cloud.profile || {});
  state.logs = cloud.flatLogs();
  applyTheme();
  if (!state.goals){
    state.goals = [];
    if (state.meta){ state.goals.unshift({ id:'gm', name:state.meta, area:'personal', why:state.porque||'', hor:1, principal:true }); }
    await save();
  }
  let mig=false;
  (state.goals||[]).forEach(g=>{ if(g.hor==null){ const s=METAS_SEMILLA.find(m=>m.name===g.name); g.hor=s?s.hor:1; mig=true; } });
  // Metas creadas cuando se permitían 15 y 20 años: se ajustan al tope actual.
  (state.goals||[]).forEach(g=>{ if(g.hor>HOR_MAX){ g.hor=HOR_MAX; mig=true; } });
  (state.actions||[]).forEach(a=>{ if(a.goalId===undefined){
    const s=SUGERIDAS.find(x=>x.name===a.name);
    const g=s&&s.goal?goalByName(s.goal):null;
    a.goalId=g?g.id:null; mig=true; } });
  const AFIRM_OLD = ['Me quiero a mí mismo y me acepto incondicionalmente.','Soy responsable: soy el arquitecto de mi propio destino.','Soy capaz de lograr lo que me propongo, con paz y con energía.'];
  if (!state.affirmations || JSON.stringify(state.affirmations)===JSON.stringify(AFIRM_OLD)){ state.affirmations=AFIRM_BASE.slice(); mig=true; }
  if(mig) await save();
  view = isNewAccount ? { name:'onboarding', step:1 } : { name:'hoy' };
  render();
}
// Cambios remotos (otro dispositivo/pestaña) llegan por onSnapshot en cloud.attach().
// Solo dispara en cambios que NO sean nuestras propias escrituras pendientes.
function onRemoteChange(){
  state = Object.assign(state, cloud.profile || {});
  state.logs = cloud.flatLogs();
  render();
}
async function save(){
  if (!currentUser) return;
  // Único punto de escritura de la app hacia Firestore (perfil + log de
  // hoy): si la escritura falla (permisos, cuota, sin red y sin caché
  // local todavía), se avisa en vez de dejar la UI en un estado "guardado"
  // que en realidad no llegó a la nube.
  try{
    await cloud.saveProfile({
      theme: state.theme, goals: state.goals, actions: state.actions,
      affirmations: state.affirmations, logros: state.logros, subs: state.subs
    });
    const hoy = todayStr();
    // Invariante: toda mutación de logs en esta app toca solo el día de hoy
    // (ritual AM/PM, recuperación) — ver nota en cloud.saveCurrentMonthBucket.
    if (state.logs[hoy] !== undefined) await cloud.saveCurrentMonthBucket(hoy, state.logs[hoy]);
  }catch(e){
    toast('No se pudo guardar en la nube. Revisa tu conexión e intenta de nuevo.');
  }
}
function toast(t){ const el=document.getElementById('toast');
  el.textContent=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2300); }
function principal(){ return (state.goals||[]).find(g=>g.principal) || null; }

/* ===== FRECUENCIA DE ACCIONES ===== */
// action.days: días de la semana en que toca la acción, con la numeración de
// Date.getDay() (0=domingo). Si falta, la acción es diaria — así las acciones
// creadas antes de existir este campo siguen funcionando sin migración.
// Se guarda ausente (no [0..6]) cuando son los 7 días, para tener una sola
// forma canónica de "diaria".
const DIAS_LETRA = ['D','L','M','X','J','V','S'];
const DIAS_NOM = ['dom','lun','mar','mié','jue','vie','sáb'];
const ORDEN_SEMANA = [1,2,3,4,5,6,0]; // la semana se muestra de lunes a domingo
function weekdayOf(s){ const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]).getDay(); }
function isScheduled(a,s){ return !a.days || a.days.includes(weekdayOf(s)); }
// Acciones que tocan en el día s (yyyy-MM-dd). Todo lo que mide cumplimiento
// usa esto como denominador: una acción semanal no "falla" los días que no le tocan.
function actsOn(s){ return state.actions.filter(a=>isScheduled(a,s)); }
function freqTxt(a){
  if(!a.days) return 'diaria';
  const nombres=ORDEN_SEMANA.filter(d=>a.days.includes(d)).map(d=>DIAS_NOM[d]).join(', ');
  return (a.days.length===1?'semanal':a.days.length+'× semana')+' · '+nombres;
}

/* ===== MOTOR ===== */
// Umbrales del método (regla no negociable #1 en CLAUDE.md): única fuente de verdad,
// usados por diagnose(), govColor() y el tono de "Tus gobernadores" en renderHoy().
const MIN_NOCHES_CALIBRACION = 5;   // <5 registros pm en 7d => estado "calibrando", sin diagnóstico
const UMBRAL_GOV_RIESGO = 5;        // paz/energía por debajo de esto = riesgo de gobernador
const UMBRAL_GOV_ALERTA = 6.5;      // por debajo de esto (sin llegar a riesgo) = alerta temprana visual
const UMBRAL_TENDENCIA_RIESGO = -2; // caída vs. semana previa que dispara riesgo
const UMBRAL_TENDENCIA_ALERTA = -1; // caída menor que solo amerita alerta visual
const UMBRAL_CUMPLIMIENTO_ALTO = 70; // % cumplimiento 7d para considerarse "alto"

function firstLog(){ const k=Object.keys(state.logs).sort(); return k.length?k[0]:null; }
function dayCounts(L){ return L && (L.am || L.pm); }
// Recorre TODO el historial desde el primer log cada vez (nunca se guarda un contador,
// regla #4): así la racha jamás puede desincronizarse de logs si se edita/borra un día.
// rec => congela (ni suma ni corta); am/pm => suma; día vacío => corta (regla #2/#3).
function streak(upTo){
  const start=firstLog(); if(!start) return 0;
  let s=0,d=start;
  while(d<=upTo){ const L=state.logs[d];
    if(L&&L.rec){} else if(dayCounts(L)){s+=1;} else {s=0;}
    d=addDays(d,1); }
  return s;
}
// Igual que streak(), pero conserva la racha más larga vista en el historial (récord).
function record(upTo){
  const start=firstLog(); if(!start) return 0;
  let s=0,b=0,d=start;
  while(d<=upTo){ const L=state.logs[d];
    if(L&&L.rec){} else if(dayCounts(L)){s+=1;if(s>b)b=s;} else {s=0;}
    d=addDays(d,1); }
  return b;
}
// Promedios de una ventana de 7 días calendario terminando en (endDate - off).
// Solo cuentan las noches con pm registrado: un día sin registro no entra al promedio,
// solo corta la racha (regla #3) — nunca se castiga un promedio por días faltantes.
// Una noche con pct null (ese día no tocaba ninguna acción) sí cuenta para los
// gobernadores, pero no para el cumplimiento: no había nada que cumplir, y
// promediarla como 0% o 100% falsearía el dato (mismo espíritu que la regla #3).
function winStats(endDate,off){
  let n=0,nc=0,cum=0,paz=0,ener=0;
  for(let i=0;i<7;i++){ const L=state.logs[addDays(endDate,-off-i)];
    if(L&&L.pm){ n++; paz+=L.pm.paz; ener+=L.pm.ener;
      if(typeof L.pm.pct==='number'){ nc++; cum+=L.pm.pct; } } }
  if(!n) return {n:0};
  return {n,cump:nc?Math.round(cum/nc*100):null,paz:Math.round(paz/n*10)/10,ener:Math.round(ener/n*10)/10};
}
// tP/tE (tendencia) quedan en null si la semana previa no tiene al menos
// MIN_NOCHES_CALIBRACION registros — comparar contra una base con muy pocos datos
// daría una tendencia engañosa, así que se prefiere "sin dato" a un falso positivo.
function diagnose(endDate){
  const w=winStats(endDate,0);
  if(w.n<MIN_NOCHES_CALIBRACION) return {estado:'calibrando',w};
  const p=winStats(endDate,7);
  let tP=null,tE=null;
  if(p.n>=MIN_NOCHES_CALIBRACION){ tP=Math.round((w.paz-p.paz)*10)/10; tE=Math.round((w.ener-p.ener)*10)/10; }
  const riesgo = w.paz<UMBRAL_GOV_RIESGO||w.ener<UMBRAL_GOV_RIESGO
    ||(tP!==null&&tP<=UMBRAL_TENDENCIA_RIESGO)||(tE!==null&&tE<=UMBRAL_TENDENCIA_RIESGO);
  // cump null = en toda la semana no tocaba ninguna acción: no hubo nada que
  // incumplir, así que no se lee como cumplimiento bajo.
  const alto = w.cump===null || w.cump>=UMBRAL_CUMPLIMIENTO_ALTO;
  return {estado: alto?(riesgo?'quemandose':'enmarcha'):(riesgo?'apagado':'aladeriva'), w,tP,tE};
}
const META_E={
  calibrando:{nom:'Calibrando',color:'#8B8A86',bg:'#EFEEE9',msg:'Menos de 5 noches registradas en la semana: el sistema aún no diagnostica. Solo sigue registrando.'},
  enmarcha:{nom:'En marcha',color:'#1D9E75',bg:'#E2F2EB',msg:'Tu semana se sostuvo: cumpliste y tus gobernadores están sanos. Causa y efecto operando a tu favor. Si esto dura una semana más, considera subir una acción.'},
  quemandose:{nom:'Quemándose',color:'#D64545',bg:'#F9E2E2',msg:'Tu mundo exterior brilla pero el interior se deteriora — la Ley de Correspondencia dice que eso no se sostiene. Frena: día de recuperación (la racha se conserva), pausa una acción, o revisa la carga.'},
  aladeriva:{nom:'A la deriva',color:'#C97D0B',bg:'#FAE7C6',msg:'Energía tienes — la dirección se soltó. El cerebro es teleológico: sin objetivo claro no dispara. Relee tu meta principal y su porqué: ¿estas acciones siguen siendo las correctas?'},
  apagado:{nom:'Apagado',color:'#1F66C1',bg:'#E4EEF9',msg:'Tanque y rumbo bajos, sin culpa. Mañana: recuperación. Al volver, retoma solo tu acción más pequeña y tu afirmación.'}
};
function govColor(v,t){
  if(v<UMBRAL_GOV_RIESGO||(t!==null&&t<=UMBRAL_TENDENCIA_RIESGO)) return '#D64545';
  if(v<UMBRAL_GOV_ALERTA||(t!==null&&t<=UMBRAL_TENDENCIA_ALERTA)) return '#E8940F';
  return '#1D9E75';
}
function weekIdx(){ const d=new Date(); const onejan=new Date(d.getFullYear(),0,1);
  return Math.floor((d-onejan)/(7*86400000)) % REFLEX.length; }

const app=document.getElementById('app'), fab=document.getElementById('fab'), nav=document.getElementById('nav');
function el(h){ const d=document.createElement('div'); d.innerHTML=h; return d; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(){
  if(timerId){ clearInterval(timerId); timerId=null; }
  app.innerHTML='';
  const noChrome = view.name==='am'||view.name==='pm'||view.name==='login'||view.name==='onboarding';

  ({hoy:renderHoy, ajustes:renderAjustes, am:renderAM, pm:renderPM,
    metas:renderMetas, acts:renderActs, logros:renderLogros, review:renderReview,
    login:renderLogin, onboarding:renderOnboarding})[view.name]();

}

function arcSVG(score,color){
  const T=126, off=Math.max(0,Math.round(T-(score/10)*T));
  return '<svg viewBox="0 0 100 60" class="arcwrap" role="img"><title>Medidor</title>'+
    '<path d="M 10 55 A 40 40 0 0 1 90 55" fill="none" stroke="var(--line)" stroke-width="9" stroke-linecap="round"/>'+
    '<path d="M 10 55 A 40 40 0 0 1 90 55" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+T+'" stroke-dashoffset="'+off+'"/></svg>';
}

function ritualStepsHTML(current,total){
  let h='';
  for(let i=1;i<=total;i++){
    if(i>1) h+='<div class="rline'+(i<=current?' done':'')+'"></div>';
    h+='<div class="rstep'+(i===current?' active':(i<current?' done':''))+'">'+(i<current?'✓':i)+'</div>';
  }
  return '<div class="rsteps">'+h+'</div>';
}

function renderLogin(){
  app.appendChild(el('<div style="margin-top:30px; margin-bottom:14px; text-align:center;"><h1>Fénix</h1><div class="sub">Tu potencial, sin quemarte.</div></div>'));

  if(currentUser && pendingDataError){
    const derr = pendingDataError;
    const dc=el('<div class="card">'+
      '<div class="q">No pudimos cargar tus datos</div>'+
      '<div class="msgbox" style="color:var(--risk); margin-top:8px;">'+esc(derr)+'</div>'+
      '<button class="btn primary" id="retry">Reintentar</button>'+
      '<button class="btn ghost" id="so">Cerrar sesión</button></div>');
    app.appendChild(dc);
    dc.querySelector('#retry').onclick=()=>{ pendingDataError=null; onAuthChange(currentUser); };
    dc.querySelector('#so').onclick=async()=>{ pendingDataError=null; await signOutUser(); };
    return;
  }

  const mode = view.mode || 'login';
  const err = pendingAuthError; pendingAuthError = null;
  const c=el('<div class="card">'+
    '<div class="q">'+(mode==='signup'?'Crear cuenta':'Iniciar sesión')+'</div>'+
    (err?'<div class="msgbox" style="color:var(--risk); margin-top:8px;">'+esc(err)+'</div>':'')+
    '<label for="em" style="display:block; margin-top:10px;">Correo</label>'+
    '<input type="email" id="em" placeholder="tucorreo@ejemplo.com" autocomplete="email">'+
    '<label for="pw" style="display:block; margin-top:8px;">Contraseña</label>'+
    '<input type="password" id="pw" placeholder="Mínimo 6 caracteres" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'">'+
    '<button class="btn primary" id="go">'+(mode==='signup'?'Crear cuenta':'Entrar')+'</button>'+
    '<button class="btn" id="google" style="text-align:center;">Continuar con Google</button>'+
    (mode==='signup'?'':'<button class="btn ghost" id="forgot">¿Olvidaste tu contraseña?</button>')+
    '<button class="btn ghost" id="toggle">'+(mode==='signup'?'Ya tengo cuenta':'Crear una cuenta nueva')+'</button>'+
    '</div>');
  app.appendChild(c);
  const submit=async()=>{
    const email=c.querySelector('#em').value.trim(), pass=c.querySelector('#pw').value;
    if(!email||!pass){ toast('Completa correo y contraseña.'); return; }
    const fn = mode==='signup'?signUpWithEmail:signInWithEmailPass;
    const e2 = await fn(email,pass);
    if(e2){ pendingAuthError=e2; render(); }
  };
  c.querySelector('#go').onclick=submit;
  c.querySelector('#pw').onkeydown=(ev)=>{ if(ev.key==='Enter') submit(); };
  c.querySelector('#google').onclick=async()=>{
    const e2 = await signInWithGoogle();
    if(e2){ pendingAuthError=e2; render(); }
  };
  const forgot=c.querySelector('#forgot');
  if(forgot) forgot.onclick=async()=>{
    const email=c.querySelector('#em').value.trim();
    if(!email){ toast('Escribe tu correo primero, arriba.'); return; }
    const e2 = await resetPassword(email);
    if(e2){ pendingAuthError=e2; render(); }
    else toast('Te enviamos un correo para restablecer tu contraseña.');
  };
  c.querySelector('#toggle').onclick=()=>{ view={name:'login', mode: mode==='signup'?'login':'signup'}; render(); };
}

/* ===== PESTAÑA: HOY (DASHBOARD UNIFICADO) ===== */
function renderHoy(){
  const hoy=todayStr(), L=state.logs[hoy]||{}, pg=principal();
  const dg=diagnose(hoy), w=dg.w, s=streak(hoy), rec=record(hoy);

  app.appendChild(el('<div style="margin-bottom:14px;"><h1>Hoy</h1><div class="sub">Tu potencial, sin quemarte.</div></div>'));

  if(!(state.goals||[]).length){
    const c=el('<div class="card"><div class="q">Define tu primera meta</div>'+
      '<div class="sub" style="margin-top:6px;">Todo en Fénix nace de una meta: tus acciones diarias, tu roca de cada mañana y tu ritual nocturno cuelgan de ella. Empecemos por ahí — toma menos de un minuto.</div>'+
      '<button class="btn primary" id="go">Crear mi meta</button></div>');
    app.appendChild(c);
    c.querySelector('#go').onclick=()=>{view={name:'onboarding', step:2, returning:true};render();};
    return;
  }

  if(!state.actions.length){
    const c=el('<div class="card"><div class="q">Elige tus acciones diarias</div>'+
      '<div class="sub" style="margin-top:6px;">Cada acción vive en una de tus 6 áreas'+(pg?' y puede servir a tu meta "'+esc(pg.name)+'"':' y puede servir a una meta')+'. Empieza con 3.</div>'+
      '<button class="btn primary" id="go">Elegir mis acciones</button></div>');
    app.appendChild(c);
    c.querySelector('#go').onclick=()=>{view={name:'onboarding', step:3, chosen:[], returning:true};render();};
    return;
  }

  /* 1. KPIs de Momento (Racha, Récord, Cumplimiento) */
  app.appendChild(el('<div class="kpis">'+
    '<div class="kpi"><div class="kval"><span style="color:var(--blue);">🔥</span> '+s+'</div><div class="klab">racha</div></div>'+
    '<div class="kpi"><div class="kval">'+rec+'</div><div class="klab">récord</div></div>'+
    '<div class="kpi"><div class="kval">'+(w.n&&w.cump!==null?w.cump+'%':'—')+'</div><div class="klab">cumplim. 7d</div></div></div>'));

  /* 2. Gobernadores (Paz mental & Energía) */
  const gp=w.n?w.paz:null, ge=w.n?w.ener:null;
  const cp=gp===null?'var(--line)':govColor(gp,dg.tP??null);
  const ce=ge===null?'var(--line)':govColor(ge,dg.tE??null);
  const ar=t=>t===null||t===undefined?'':(t>0.3?' ↑':t<-0.3?' ↓':' →');
  const enR=dg.estado==='quemandose'||dg.estado==='apagado';
  const tone=enR?{bg:'var(--riskbg)',tx:'var(--risk)'}
    :(gp!==null&&(gp<UMBRAL_GOV_ALERTA||ge<UMBRAL_GOV_ALERTA||(dg.tE??0)<=UMBRAL_TENDENCIA_ALERTA||(dg.tP??0)<=UMBRAL_TENDENCIA_ALERTA))?{bg:'var(--warnbg)',tx:'var(--warn)'}
    :{bg:'var(--calmbg)',tx:'var(--calm)'};
  const gtxt=gp===null?'Registra tus primeras noches para ver tus gobernadores.'
    :enR?'Tus gobernadores están pidiendo una pausa. Toca para recalibrar.'
    :tone.tx==='var(--warn)'?'Alguno de tus gobernadores viene bajando esta semana. Vale la pena mirarlo.'
    :'Tu ritmo se está sosteniendo.';
  const gov=el('<div class="card"><div style="display:flex; justify-content:space-between; align-items:center;"><div class="secthead" style="margin:0;">Tus gobernadores · 7 días</div><span style="color:var(--muted);">♡</span></div><div class="gov2" style="margin-top:10px;">'+
    '<div class="gcell">'+arcSVG(gp??0,cp)+'<div style="margin-top:-6px;"><span class="gval">'+(gp??'—')+'</span><span style="font-size:13px; color:'+cp+';">'+ar(dg.tP)+'</span></div><div class="glab">paz mental</div></div>'+
    '<div class="gcell">'+arcSVG(ge??0,ce)+'<div style="margin-top:-6px;"><span class="gval">'+(ge??'—')+'</span><span style="font-size:13px; color:'+ce+';">'+ar(dg.tE)+'</span></div><div class="glab">energía</div></div></div>'+
    '<button class="govmsg" id="gm" style="background:'+tone.bg+'; color:'+tone.tx+';">'+gtxt+'</button></div>');
  app.appendChild(gov);
  gov.querySelector('#gm').onclick=()=>{view={name:'review'};render();};

  /* 3. Rituales (Accesos directos) */
  const rit=el('<div style="display:flex; gap:8px; margin-bottom:12px;">'+
    '<button class="btn '+(L.am?'':'primary')+'" id="bam" style="margin:0; flex:1; text-align:center;">'+
      (L.am?'Mañana ✓':'☀️ Ritual de la mañana')+'</button>'+
    '<button class="btn '+(L.pm?'':(L.am?'primary':''))+'" id="bpm" style="margin:0; flex:1; text-align:center;">'+
      (L.pm?'Noche ✓':(L.rec?'Recuperación ✓':'🌙 Ritual de la noche'))+'</button></div>');
  app.appendChild(rit);
  rit.querySelector('#bam').onclick=()=>{view={name:'am',step:1};render();};
  rit.querySelector('#bpm').onclick=()=>{view={name:'pm',step:1,done:[]};render();};

  /* 4. Meta Principal ⭐ */
  if(pg){
    const actsPg=state.actions.filter(a=>a.goalId===pg.id);
    let pgDone=0, pgTotal=0;
    for(let i=0;i<7;i++){
      const d=addDays(hoy,-i), Ld=state.logs[d];
      if(Ld&&Ld.pm){ actsPg.forEach(a=>{ if(!isScheduled(a,d)) return; pgTotal++;
        if(Ld.pm.done&&Ld.pm.done.includes(a.id)) pgDone++; }); }
    }
    const pgPct=pgTotal?Math.round(pgDone/pgTotal*100):0;
    const mp=el('<button class="card" style="width:100%; text-align:left; display:block;">'+
      '<div class="secthead" style="margin-bottom:4px;">⭐ Meta principal <span style="color:var(--star); text-transform:none; letter-spacing:0;">· a '+(pg.hor||1)+' '+((pg.hor||1)===1?'año':'años')+(pg.created?' · '+elapsedTxt(pg.created):'')+'</span></div>'+
      '<div style="font-size:14px; line-height:1.4; font-weight:600;">'+esc(pg.name)+'</div>'+
      (pg.why?'<div class="sub" style="margin-top:4px; font-size:12px;">Porqué: '+esc(pg.why)+'</div>':'')+
      (actsPg.length?
        '<div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:9px; margin-bottom:4px;">'+
        '<span>Avance esta semana</span><span>'+pgDone+' de '+pgTotal+' acciones</span></div>'+
        '<div style="height:5px; background:var(--line); border-radius:3px; overflow:hidden;">'+
        '<div style="width:'+pgPct+'%; height:100%; background:var(--blue);"></div></div>'
        :'<div class="sub" style="margin-top:8px; font-size:11.5px; color:var(--warn);">Ninguna acción diaria sirve a esta meta — la estrella está sin escalera. Toca para revisar.</div>')+
      '</button>');
    app.appendChild(mp);
    mp.firstChild.onclick=()=>{view={name:(actsPg.length?'metas':'acts')};render();};
  }

  /* 5. Roca de Hoy 🪨 */
  if(L.am&&L.am.roca){
    const a=state.actions.find(x=>x.id===L.am.roca);
    if(a){
      const gR=goalById(a.goalId), esP=pg&&a.goalId===pg.id;
      app.appendChild(el('<div class="card" style="border-color:var(--blue);"><div class="secthead" style="margin-bottom:4px;">🪨 Tu roca de hoy (el 20% que importa)</div>'+
        '<div style="font-size:14px; font-weight:600;">'+esc(a.name)+'</div>'+
        (esP?'<div class="sub" style="margin-top:3px; font-size:11.5px; color:var(--blue);">🪨 → ⭐ rueda hacia tu meta principal</div>'
          :(gR?'<div class="sub" style="margin-top:3px; font-size:11.5px;">→ '+esc(gR.name)+'</div>':''))+
        '</div>'));
    }
  }

  /* 6. Acciones de Hoy */
  const acc=el('<div class="card"><div class="secthead">Tus acciones de hoy</div><div id="al"></div></div>');
  app.appendChild(acc);
  const al=acc.querySelector('#al');
  const doneHoy=(L.pm&&L.pm.done)||[];
  const tocanHoy=actsOn(hoy), otras=state.actions.length-tocanHoy.length;
  if(!tocanHoy.length) al.appendChild(el('<div class="sub" style="margin:0;">Hoy no te toca ninguna acción. Día libre de acciones: tus rituales siguen contando.</div>'));
  tocanHoy.forEach(a=>{
    const A=AREAS[a.area], done=doneHoy.includes(a.id);
    al.appendChild(el('<div style="display:flex; align-items:center; gap:9px; padding:7px 0; font-size:13.5px;">'+
      '<span style="color:'+(done?'var(--calm)':'var(--muted)')+'; font-weight:600;">'+(done?'✓':'○')+'</span>'+
      '<span style="flex:1;">'+esc(a.name)+(a.days?'<div class="sub" style="margin:0; font-size:11px;">'+freqTxt(a)+'</div>':'')+'</span>'+
      '<span class="atag" style="background:'+A.color+'1c; color:'+A.color+';">'+A.nom+'</span></div>'));
  });
  if(otras>0) al.appendChild(el('<div class="sub" style="margin-top:6px; font-size:11.5px;">'+otras+' '+(otras===1?'acción no toca':'acciones no tocan')+' hoy.</div>'));

  /* 7. Constancia (Heatmap 4 semanas) */
  const hm=el('<div class="card"><div class="secthead">Constancia · últimas 4 semanas</div><div class="heat" id="hm"></div>'+
    '<div class="legend"><span><i style="background:var(--blue);"></i>cumplido</span>'+
    '<span><i style="background:var(--heat-partial);"></i>parcial</span>'+
    '<span><i style="background:var(--recov);"></i>recuperación</span></div></div>');
  app.appendChild(hm);
  const grid=hm.querySelector('#hm');
  for(let i=27;i>=0;i--){
    const d=addDays(hoy,-i), Ld=state.logs[d];
    const cell=document.createElement('div');
    if(!Ld) cell.style.background='var(--heat-empty)';
    else if(Ld.rec) cell.style.background='var(--recov)';
    else if(Ld.pm&&typeof Ld.pm.pct!=='number') cell.style.background='var(--blue)'; // no tocaba nada: noche cerrada
    else if(Ld.pm) cell.style.background=Ld.pm.pct>=0.8?'var(--blue)':(Ld.pm.pct>0?'var(--heat-partial)':'var(--heat-bad)');
    else if(Ld.am) cell.style.background='var(--heat-partial)';
    else cell.style.background='var(--heat-empty)';
    cell.title=d; grid.appendChild(cell);
  }

  /* 8. Acceso a Revisión Semanal */
  const rv=el('<button class="row"><span><div style="font-size:14px; font-weight:600;">Revisión semanal</div>'+
    '<div class="sub" style="margin:0; font-size:11.5px;">estado, balance de áreas y avance de metas</div></span>'+
    '<span style="color:var(--muted);">›</span></button>');
  app.appendChild(rv);
  rv.firstChild.onclick=()=>{view={name:'review'};render();};
}

function renderPM(){
  const hoy=todayStr(), step=view.step||1;
  const back=el('<button class="back">← Volver</button>');
  app.appendChild(back);
  back.firstChild.onclick=()=>{view={name:'hoy'};render();};
  app.appendChild(el(ritualStepsHTML(step,4)));

  if(step===1){
    const c=el('<div class="card"><div class="secthead">Noche · 1 de 4 · Acción diaria</div>'+
      '<div class="q">¿Qué cumpliste hoy?</div><div id="list"></div>'+
      '<button class="btn primary" id="n">Continuar</button>'+
      '<button class="btn ghost" id="rec">Hoy fue día de recuperación (racha se conserva)</button></div>');
    app.appendChild(c);
    const list=c.querySelector('#list');
    const tocan=actsOn(hoy);
    if(!tocan.length) list.appendChild(el('<div class="sub" style="margin-top:8px;">Hoy no te tocaba ninguna acción. Sigue con tu gratitud y tus gobernadores.</div>'));
    const ordered=tocan.slice().sort((a,b)=>(b.id===roca)-(a.id===roca));
    ordered.forEach(a=>{
      const A=AREAS[a.area], isR=a.id===roca;
      const b=document.createElement('button');
      b.className='act'+(view.done.includes(a.id)?' on':'');
      if(isR) b.style.borderColor='var(--blue)';
      b.innerHTML='<span class="cb">'+(view.done.includes(a.id)?'✓':'')+'</span>'+
        '<span class="aname">'+(isR?'🪨 ':'')+esc(a.name)+'</span>'+
        '<span class="atag" style="background:'+A.color+'1c; color:'+A.color+';">'+A.nom+'</span>';
      b.onclick=()=>{ const i=view.done.indexOf(a.id);
        if(i>=0) view.done.splice(i,1); else view.done.push(a.id); render(); };
      list.appendChild(b);
    });
    c.querySelector('#n').onclick=()=>{view.step=2;render();};
    c.querySelector('#rec').onclick=async()=>{
      const cur=state.logs[hoy];
      if(cur&&cur.pm&&!confirm('Ya registraste tu noche hoy. ¿Reemplazarla por un día de recuperación? Se perderá lo registrado (gratitud, gobernadores).')) return;
      state.logs[hoy]=(cur&&cur.am)?{am:cur.am,rec:true}:{rec:true};
      await save(); view={name:'hoy'}; render();
      toast('Recuperación registrada. La racha se congela, no se rompe.');
    };
  } else if(step===2){
    const c=el('<div class="card"><div class="secthead">Noche · 2 de 4 · Gratitud (Atracción)</div>'+
      '<div class="q">Tres cosas de hoy que agradeces</div>'+
      '<div class="sub">Eres un imán de tus pensamientos predominantes. Cierra el día apuntando al norte.</div>'+
      '<input type="text" id="g1" placeholder="Algo que salió bien hoy…">'+
      '<input type="text" id="g2" placeholder="Alguien o un gesto que aprecio…">'+
      '<input type="text" id="g3" placeholder="Un momento o aprendizaje del día…">'+
      '<button class="btn primary" id="n">Continuar</button></div>');
    app.appendChild(c);
    c.querySelector('#n').onclick=()=>{
      view.grat=[c.querySelector('#g1').value.trim(),c.querySelector('#g2').value.trim(),c.querySelector('#g3').value.trim()].filter(Boolean);
      view.step=3; render();
    };
  } else if(step===3){
    const c=el('<div class="card"><div class="secthead">Noche · 3 de 4 · Gobernador 1</div>'+
      '<div class="q">¿Paz mental hoy?</div><div class="scale" id="sc"></div>'+
      '<div class="anchors">1–4 ansiedad constante · 5–6 funcional con ruido · 7–10 sereno y presente</div></div>');
    app.appendChild(c);
    scaleInto(c.querySelector('#sc'),v=>{view.paz=v;view.step=4;render();});
  } else {
    const c=el('<div class="card"><div class="secthead">Noche · 4 de 4 · Gobernador 2</div>'+
      '<div class="q">¿Energía hoy?</div><div class="scale" id="sc"></div>'+
      '<div class="anchors">1–4 agotado · 5–6 alcanza sin sobra · 7–10 vitalidad plena</div></div>');
    app.appendChild(c);
    scaleInto(c.querySelector('#sc'),async v=>{
      const total=actsOn(hoy).length;
      state.logs[hoy]=state.logs[hoy]||{};
      delete state.logs[hoy].rec; // rec y pm son excluyentes: un ritual completo ya no es día de recuperación
      state.logs[hoy].pm={done:view.done.slice(),pct:total?view.done.length/total:null,grat:view.grat||[],paz:view.paz,ener:v};
      await save(); view={name:'hoy'}; render();
      toast('Día cerrado en positivo. Buenas noches.');
    });
  }
}
function scaleInto(node,fn){
  for(let i=1;i<=10;i++){
    const b=document.createElement('button');
    b.textContent=i;
    b.onclick=()=>{
      const all=node.querySelectorAll('button');
      all.forEach(btn=>btn.classList.remove('picked'));
      b.classList.add('picked');
      setTimeout(()=>fn(i),180);
    };
    node.appendChild(b);
  }
}

  view.open = view.open || { h1:true };
  HORIZONTES.forEach(b=>{
    const metas=(state.goals||[]).filter(g=>horBucket(g.hor).id===b.id)
      .sort((x,y)=>(y.principal-x.principal)||((x.hor||1)-(y.hor||1)));
    if(!metas.length) return;
    const abierto=!!view.open[b.id];
    const sec=el('<div class="card">'+
      '<button style="background:none; width:100%; text-align:left; padding:0; display:flex; justify-content:space-between; align-items:center;">'+
      '<span><span class="secthead" style="margin:0; display:inline;">'+b.nom+'</span>'+
      ' <span style="font-size:11px; color:var(--muted);">· '+metas.length+'</span></span>'+
      '<span style="color:var(--muted); font-size:13px;">'+(abierto?'▾':'▸')+'</span></button>'+
      (abierto?'<div class="sub" style="font-size:11.5px; margin-top:6px;">'+b.sub+'</div><div class="mlist"></div>':'')+
      '</div>');
    app.appendChild(sec);
    sec.querySelector('button').onclick=()=>{ view.open[b.id]=!abierto; render(); };
    if(!abierto) return;
    const gl=sec.querySelector('.mlist');
    metas.forEach(g=>{
      if(view.edit===g.id){ renderGoalEdit(gl,g); return; }
      const A=AREAS[g.area];
      const r=document.createElement('div');
      r.className='act';
      if(g.principal) r.style.borderColor='var(--star)';
      r.innerHTML='<button class="star'+(g.principal?' on':'')+'" aria-label="Marcar principal">⭐</button>'+
        '<span class="aname">'+esc(g.name)+
        '<div class="sub" style="margin-top:2px; font-size:11.5px;">'+
        '<span style="color:var(--star);">a '+(g.hor||1)+' '+((g.hor||1)===1?'año':'años')+'</span>'+
        (g.created?' · desde '+fmtDateShort(g.created)+' ('+elapsedTxt(g.created)+')':'')+
        (g.why?' · '+esc(g.why):'')+'</div></span>'+
        '<span class="atag" style="background:'+A.color+'1c; color:'+A.color+';">'+A.nom+'</span>'+
        '<button class="edit" aria-label="Editar">✎</button>'+
        '<button class="edit" aria-label="Quitar">✕</button>';
      const btns=r.querySelectorAll('button');
      btns[0].onclick=async()=>{
        if(!g.principal && (g.hor||1)>1 && !confirm('Esta meta es a '+g.hor+' años. La principal debería ser de este año — la visualizarás cada mañana. ¿Marcarla igual?')) return;
        state.goals.forEach(x=>x.principal=(x.id===g.id)?!g.principal:false);
        await save(); render();
        if(!g.principal) toast('Meta principal: '+g.name);
      };
      btns[1].onclick=()=>{ view.edit=g.id; render(); };
      btns[2].onclick=async()=>{
        if(confirm('¿Quitar esta meta?')){
          state.goals=state.goals.filter(x=>x.id!==g.id);
          // Las acciones que servían a esta meta pasan a hábito de vida en vez
          // de quedar apuntando a una meta que ya no existe.
          state.actions.forEach(a=>{ if(a.goalId===g.id) a.goalId=null; });
          await save(); render();
        }
      };
      gl.appendChild(r);
    });
  });

  const add=el('<div class="card"><div class="secthead">Agregar meta</div>'+goalFormHTML(null)+
    '<button class="btn primary" id="ok">Agregar</button></div>');
  app.appendChild(add);
  add.querySelector('#ok').onclick=async()=>{
    const d=readGoalForm(add);
    if(!d.name){toast('Escribe la meta.');return;}
    state.goals.push(Object.assign({id:'g'+Date.now()},d,{principal:false,created:todayStr()}));
    await save(); render();
  };
}

/* ===== ACCIONES ===== */
// Formulario compartido por "Agregar acción" y "Editar acción". a = acción a editar o null.
function actionFormHTML(a){
  const v=a||{name:'',area:'personal',goalId:null};
  const anuales=(state.goals||[]).filter(g=>(g.hor||1)<=1);
  const otras=(state.goals||[]).filter(g=>(g.hor||1)>1);
  const sel=id=>id===v.goalId?' selected':'';
  const opts='<option value="">— hábito de vida (sin meta) —</option>'+
    anuales.map(g=>'<option value="'+g.id+'"'+sel(g.id)+'>'+esc(g.name)+(g.principal?' ⭐':'')+'</option>').join('')+
    (otras.length?'<optgroup label="Metas de más plazo">'+otras.map(g=>'<option value="'+g.id+'"'+sel(g.id)+'>'+esc(g.name)+' ('+g.hor+'a)</option>').join('')+'</optgroup>':'');
  return '<label for="an">Acción (viable en un día malo)</label><input type="text" id="an" placeholder="Caminata de 30 minutos" value="'+esc(v.name)+'">'+
    '<label for="ag" style="display:block; margin-top:8px;">¿A qué meta sirve?</label><select id="ag">'+opts+'</select>'+
    '<label for="aa" style="display:block; margin-top:8px;">Área</label><select id="aa">'+
    Object.keys(AREAS).map(k=>'<option value="'+k+'"'+(k===v.area?' selected':'')+'>'+AREAS[k].nom+'</option>').join('')+
    '</select>'+
    '<label style="display:block; margin-top:8px;">¿Qué días?</label><div class="days" id="ad">'+
    ORDEN_SEMANA.map(d=>'<button type="button" data-d="'+d+'" aria-label="'+DIAS_NOM[d]+'" class="'+(!v.days||v.days.includes(d)?'on':'')+'">'+DIAS_LETRA[d]+'</button>').join('')+
    '</div><div class="sub" id="adt" style="font-size:11.5px;"></div>';
}
// Engancha los eventos del formulario. Los días se alternan directo en el DOM
// (sin render()) para no perder lo que ya se escribió en los inputs.
function wireActionForm(node){
  const txt=node.querySelector('#adt');
  const upd=()=>{ const d=readDays(node);
    txt.textContent=!d.length?'Elige al menos un día.':freqTxt({days:d.length===7?undefined:d}); };
  node.querySelectorAll('#ad button').forEach(b=>{ b.onclick=()=>{ b.classList.toggle('on'); upd(); }; });
  node.querySelector('#ag').onchange=()=>{
    const g=goalById(node.querySelector('#ag').value);
    if(g) node.querySelector('#aa').value=g.area;
  };
  upd();
}
function readDays(node){
  return Array.from(node.querySelectorAll('#ad button.on')).map(b=>parseInt(b.dataset.d)).sort();
}
// Devuelve los datos del formulario o null si no son válidos (ya avisó con toast).
function readActionForm(node){
  const name=node.querySelector('#an').value.trim();
  if(!name){toast('Escribe la acción.');return null;}
  const days=readDays(node);
  if(!days.length){toast('Elige al menos un día.');return null;}
  return { name, area:node.querySelector('#aa').value, goalId:node.querySelector('#ag').value||null,
    days: days.length===7 ? null : days };
}
// days null => diaria: se borra la clave (Firestore no acepta undefined y así
// "diaria" tiene una sola representación, ver isScheduled).
function applyActionData(a,d){
  a.name=d.name; a.area=d.area; a.goalId=d.goalId;
  if(d.days) a.days=d.days; else delete a.days;
  return a;
}
function renderActs(){
  const back=el('<button class="back">← Volver</button>');
  app.appendChild(back);
  back.firstChild.onclick=()=>{view={name:'ajustes'};render();};

  const c=el('<div class="card"><div class="q">Mis acciones</div>'+
    '<div class="sub">Recomendado: 3 · máximo: 5. El método pide profundidad, no volumen. Idealmente al menos una apunta a tu meta principal ⭐. Cada acción puede ser diaria, semanal o de algunos días: solo cuenta los días que le tocan.</div><div id="cur"></div></div>');
  app.appendChild(c);
  const cur=c.querySelector('#cur');
  state.actions.forEach(a=>{
    if(view.edit===a.id){
      const f=el('<div class="card" style="margin-top:9px; border-color:var(--blue);"><div class="secthead">Editar acción</div>'+actionFormHTML(a)+
        '<button class="btn primary" id="ok">Guardar cambios</button><button class="btn ghost" id="cx">Cancelar</button></div>');
      cur.appendChild(f);
      wireActionForm(f);
      f.querySelector('#cx').onclick=()=>{ view.edit=null; render(); };
      f.querySelector('#ok').onclick=async()=>{
        const d=readActionForm(f); if(!d) return;
        applyActionData(a,d);
        view.edit=null; await save(); render();
        toast('Acción actualizada.');
      };
      return;
    }
    const A=AREAS[a.area], g=goalById(a.goalId);
    const r=document.createElement('div');
    r.className='act';
    r.innerHTML='<span class="aname">'+esc(a.name)+
      '<div class="sub" style="margin-top:2px; font-size:11.5px;">'+
      (g?'→ '+esc(g.name)+(g.principal?' ⭐':''):'<span style="color:var(--calm);">hábito de vida</span>')+
      ' · '+freqTxt(a)+'</div></span>'+
      '<span class="atag" style="background:'+A.color+'1c; color:'+A.color+';">'+A.nom+'</span>'+
      '<button class="edit" aria-label="Editar">✎</button>'+
      '<button class="edit" aria-label="Quitar">✕</button>';
    const btns=r.querySelectorAll('button');
    btns[0].onclick=()=>{ view.edit=a.id; render(); };
    btns[1].onclick=async()=>{
      state.actions=state.actions.filter(x=>x.id!==a.id);
      await save(); render();
    };
    cur.appendChild(r);
  });

  if(state.actions.length<5){
    const add=el('<div class="card"><div class="secthead">Agregar acción</div>'+actionFormHTML(null)+
      '<button class="btn primary" id="ok">Agregar</button></div>');
    app.appendChild(add);
    wireActionForm(add);
    add.querySelector('#ok').onclick=async()=>{
      const d=readActionForm(add); if(!d) return;
      state.actions.push(applyActionData({id:'a'+Date.now()},d));
      await save(); render();
    };
    const sug=SUGERIDAS.filter(s=>!state.actions.some(a=>a.name===s.name));
    if(sug.length){
      const sc=el('<div class="card"><div class="secthead">Ideas para empezar · Sistema MP3</div><div id="sl"></div></div>');
      app.appendChild(sc);
      const sl=sc.querySelector('#sl');
      sug.forEach(s=>{
        const A=AREAS[s.area];
        const b=document.createElement('button');
        b.className='act';
        b.innerHTML='<span class="cb" style="border-style:dashed; color:var(--muted);">+</span><span class="aname">'+esc(s.name)+'</span>'+
          '<span class="atag" style="background:'+A.color+'1c; color:'+A.color+';">'+A.nom+'</span>';
        b.onclick=async()=>{
          if(state.actions.length>=5){toast('Máximo 5. Suelta una primero.');return;}
          const g=s.goal?goalByName(s.goal):null;
          state.actions.push({id:'a'+Date.now(),name:s.name,area:s.area,goalId:g?g.id:null});
          await save(); render();
        };
        sl.appendChild(b);
      });
    }
  } else {
    app.appendChild(el('<div class="card" style="color:var(--warn); font-size:13px;">Llegaste al máximo de 5. Para agregar otra, suelta una.</div>'));
  }
}

/* ===== LOGROS ===== */
function renderLogros(){
  const back=el('<button class="back">← Volver</button>');
  app.appendChild(back);
  back.firstChild.onclick=()=>{view={name:'ajustes'};render();};

  const c=el('<div class="card"><div class="q">Mis logros · '+state.logros.length+' de 100</div>'+
    '<div class="sub">Tu concepto propio es un termostato: esta lista lo sube con evidencia, no con deseo. El miedo al fracaso se derrota con memoria de victorias. Meta del seminario: llegar a 100.</div>'+
    '<input type="text" id="nl" placeholder="Agregar un logro…"><button class="btn primary" id="ok">Agregar logro</button></div>');
  app.appendChild(c);
  c.querySelector('#ok').onclick=async()=>{
    const v=c.querySelector('#nl').value.trim();
    if(!v){toast('Escribe el logro.');return;}
    state.logros.push(v); await save(); render();
    toast('Logro #'+state.logros.length+' guardado. El termostato sube.');
  };
  const lc=el('<div class="card"><div id="ll"></div></div>');
  app.appendChild(lc);
  const ll=lc.querySelector('#ll');
  state.logros.slice().reverse().forEach((l,i)=>{
    ll.appendChild(el('<div style="display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;">'+
      '<span style="color:var(--calm); font-variant-numeric:tabular-nums; flex-shrink:0;">'+(state.logros.length-i)+'</span>'+
      '<span style="line-height:1.5;">'+esc(l)+'</span></div>'));
  });
}

/* ===== REVISIÓN SEMANAL ===== */
function renderReview(){
  const hoy=todayStr(), dg=diagnose(hoy), m=META_E[dg.estado], w=dg.w;
  const back=el('<button class="back">← Volver</button>');
  app.appendChild(back);
  back.firstChild.onclick=()=>{view={name:'hoy'};render();};

  const c=el('<div class="card"><div class="q">Revisión semanal</div>'+
    '<div style="display:flex; align-items:center; gap:10px; margin-top:12px;">'+
    '<span class="chip" style="background:'+m.color+'22; color:'+m.color+';">'+m.nom+'</span>'+
    (w.n?'<span class="sub" style="margin:0;">'+(w.cump!==null?'cumplim. '+w.cump+'% · ':'')+'paz '+w.paz+' · energía '+w.ener+'</span>':'')+
    '</div><div class="msgbox">'+esc(m.msg)+'</div></div>');
  app.appendChild(c);

  if(state.actions.length){
    const per={};
    state.actions.forEach(a=>{per[a.area]=per[a.area]||{done:0,total:0};});
    for(let i=0;i<7;i++){
      const d=addDays(hoy,-i), L=state.logs[d];
      if(L&&L.pm){ actsOn(d).forEach(a=>{ per[a.area].total++;
        if(L.pm.done&&L.pm.done.includes(a.id)) per[a.area].done++; }); }
    }
    const bal=el('<div class="card"><div class="secthead">Balance por área · 7 días</div><div id="bl"></div></div>');
    app.appendChild(bal);
    const bl=bal.querySelector('#bl');
    Object.keys(per).forEach(k=>{
      const A=AREAS[k], p=per[k], pct=p.total?Math.round(p.done/p.total*100):0;
      bl.appendChild(el('<div style="margin-top:9px;"><div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;">'+
        '<span style="color:'+A.color+'; font-weight:600;">'+A.nom+'</span><span style="color:var(--muted);">'+pct+'%</span></div>'+
        '<div style="height:5px; background:var(--line); border-radius:3px; overflow:hidden;">'+
        '<div style="width:'+pct+'%; height:100%; background:'+A.color+';"></div></div></div>'));
    });
  }

  let subs=0;
  for(let i=0;i<7;i++){ subs+=state.subs[addDays(hoy,-i)]||0; }
  if(subs>0) app.appendChild(el('<div class="card" style="font-size:13px; color:var(--muted);">Usaste <b style="color:var(--text);">Sustituir</b> '+subs+' '+(subs===1?'vez':'veces')+' esta semana. Cada una fue un pensamiento que elegiste tú. Si el número crece mucho, tu paz mental te está hablando.</div>'));

  const conMeta=state.actions.filter(a=>a.goalId);
  if(conMeta.length){
    const porMeta={};
    conMeta.forEach(a=>{ porMeta[a.goalId]=porMeta[a.goalId]||{done:0,total:0,acts:[]}; porMeta[a.goalId].acts.push(a); });
    for(let i=0;i<7;i++){
      const d=addDays(hoy,-i), L=state.logs[d];
      if(L&&L.pm){ Object.keys(porMeta).forEach(gid=>{
        porMeta[gid].acts.forEach(a=>{ if(!isScheduled(a,d)) return; porMeta[gid].total++;
          if(L.pm.done&&L.pm.done.includes(a.id)) porMeta[gid].done++; }); }); }
    }
    const av=el('<div class="card"><div class="secthead">Avance hacia tus metas · 7 días</div><div id="av"></div></div>');
    app.appendChild(av);
    const avl=av.querySelector('#av');
    Object.keys(porMeta).forEach(gid=>{
      const g=goalById(gid); if(!g) return;
      const p=porMeta[gid], pct=p.total?Math.round(p.done/p.total*100):0;
      avl.appendChild(el('<div style="margin-top:9px;"><div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; gap:8px;">'+
        '<span style="line-height:1.4;">'+(g.principal?'⭐ ':'')+esc(g.name)+'</span>'+
        '<span style="color:var(--muted); flex-shrink:0;">'+p.done+' de '+p.total+'</span></div>'+
        '<div style="height:5px; background:var(--line); border-radius:3px; overflow:hidden;">'+
        '<div style="width:'+pct+'%; height:100%; background:var(--blue);"></div></div></div>'));
    });
    const habitos=state.actions.filter(a=>!a.goalId);
    if(habitos.length) avl.appendChild(el('<div class="sub" style="margin-top:10px; font-size:11.5px;">Además sostienes '+habitos.length+' '+(habitos.length===1?'hábito':'hábitos')+' de vida — esos no avanzan hacia nada: son la vida misma.</div>'));
  }

  const gratWeek=[];
  for(let i=0;i<7;i++){
    const day=addDays(hoy,-i), L=state.logs[day];
    if(L&&L.pm&&L.pm.grat&&L.pm.grat.length) gratWeek.push({day,items:L.pm.grat});
  }
  if(gratWeek.length){
    const gr=el('<div class="card"><div class="secthead">Gratitud de la semana</div><div id="gr"></div></div>');
    app.appendChild(gr);
    const grl=gr.querySelector('#gr');
    gratWeek.forEach(({day,items})=>{
      grl.appendChild(el('<div style="margin-top:9px; font-size:13px;"><div style="color:var(--muted); font-size:11.5px; margin-bottom:2px;">'+esc(day)+'</div>'+
        items.map(g=>'<div style="line-height:1.5;">· '+esc(g)+'</div>').join('')+'</div>'));
    });
  }

  const R=REFLEX[weekIdx()];
  app.appendChild(el('<div class="card"><div class="secthead">Reflexión de la semana · '+R.t+'</div>'+
    '<div class="sub" style="margin:0;">'+R.p+'</div></div>'));

  app.appendChild(el('<div class="card"><div class="secthead">Tres preguntas (piénsalas)</div>'+
    '<div class="sub" style="margin:0;">1. ¿Qué hizo que la semana funcionara?<br>2. ¿Qué te drenó?<br>3. ¿Estas acciones siguen siendo las correctas?</div></div>'));
}

if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('./sw.js'); }catch(e){} }

// onAuthStateChanged es la única fuente de verdad de sesión: hasta su primer
// disparo no se pinta login ni dashboard (se queda el "Cargando…" del HTML base),
// para no mostrar un flash de datos de otra cuenta en un dispositivo compartido.
async function onAuthChange(user){
  if(user){
    currentUser = user;
    try{
      await load();
    }catch(e){
      // En pantalla solo un mensaje claro y el código (útil para soporte);
      // el detalle técnico completo (origen, mensaje crudo) va a la consola,
      // no a la UI, para no mostrar datos internos de la cuenta ni de Firestore.
      console.error('cloud.attach falló', e && e.source, e);
      pendingDataError = 'No pudimos conectar con tus datos. Revisa tu conexión e intenta de nuevo.' +
        (e && e.code ? ' (código: '+e.code+')' : '');
      view = { name:'login' };
      render();
    }
  } else {
    currentUser = null;
    cloud.detach();
    state = { actions:[], logs:{}, affirmations:AFIRM_BASE.slice(), logros:[], goals:null, subs:{} };
    view = { name:'login' };
    render();
  }
}
(async function boot(){
  const err = await processRedirectResult();
  if(err) pendingAuthError = err;
  watchAuth(onAuthChange);
})();
</script>
